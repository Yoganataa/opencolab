<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenColab</title>
<style>
:root{color-scheme:light dark;font:13px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent;color:var(--oc-fg,inherit)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:8px;background:var(--oc-accent,#2563eb);color:#fff;font-weight:700;font-size:12px}
.copy{min-width:0}
.name{font-size:13px;font-weight:600;line-height:1.25}
.description{font-size:11px;color:var(--oc-muted,#888);margin-top:2px}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;border:1px solid var(--oc-border,#444);border-radius:7px;padding:7px 10px;background:var(--oc-button,transparent);color:inherit;font:inherit;cursor:pointer}
button:hover{background:var(--oc-hover,#222)}
button:disabled{opacity:.5;cursor:wait}
.status{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--oc-border,#333);color:var(--oc-muted,#888);font-size:11px;min-width:0}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:#888}
.dot.ok{background:#22a06b}.dot.bad{background:#d64545}.dot.loading{background:#d6a243}
#state{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">OC</span>
    <div class="copy">
      <div class="name">Session controls</div>
    </div>
  </div>
  <button id="reload" type="button" title="Reload the current page" aria-label="Reload Colab">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.5 9A7.5 7.5 0 0 1 17 5l3 2"/><path d="M4 17v-5h5"/><path d="M19.5 15A7.5 7.5 0 0 1 7 19l-3-2"/></svg>
    Reload
  </button>
</header>
<div class="status" role="status" aria-live="polite">
  <span id="dot" class="dot loading"></span>
  <span id="state">Starting Google Colab…</span>
</div>
<script src="main.js"></script>
</body>
</html>
